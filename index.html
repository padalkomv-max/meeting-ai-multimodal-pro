<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-анализатор встреч</title>
<style>body{margin:0;background:#f4f7f8;color:#172d36;font:16px system-ui,Arial}.wrap{max-width:960px;margin:auto;padding:35px 18px}h1{font-size:30px}h2{font-size:19px}.card{background:white;padding:24px;border-radius:16px;margin:18px 0;box-shadow:0 3px 16px #16333b0d}button{background:#087c72;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}input{display:block;margin:14px 0}small,.muted{color:#64777d}.meeting{border-top:1px solid #e5ecee;padding:14px 0}.meeting button{background:#e3f1ee;color:#065f58}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f6faf9;padding:15px;border-radius:10px}.error{color:#a12b2b}li{margin:8px 0}</style></head><body><main class="wrap"><h1>AI-анализатор встреч</h1><p class="muted">Загрузите короткое видео — получите расшифровку, решения, задачи и открытые вопросы.</p><section class="card"><h2>Анализ видеозаписи</h2><input type="file" id="file" accept="video/mp4,video/webm,.mp4,.webm"><button id="send">Загрузить и проанализировать</button><p id="message" aria-live="polite"></p><small>MP4 или WebM, до 120 МБ, рекомендуемая длительность 2–5 минут. Анализ запускается автоматически.</small></section><section class="card"><h2>Список встреч</h2><div id="meetings">Загрузка...</div></section><section class="card" id="detail" hidden></section></main><script>
const $=id=>document.getElementById(id);
function setupCloudImport(){const card=$('file').closest('section'),label=document.createElement('label'),input=document.createElement('input'),button=document.createElement('button'),note=document.createElement('small');label.textContent='Ссылка на видеозапись';label.htmlFor='cloudUrl';input.id='cloudUrl';input.type='url';input.placeholder='https://drive.google.com/file/d/...';input.autocomplete='off';button.id='cloudSend';button.textContent='Добавить из облака';note.textContent='Публичная HTTPS-ссылка Google Диска, только MP4/WebM, до 120 МБ.';card.append(label,input,button,note);button.onclick=async()=>{const url=input.value.trim();if(!url)return $('message').textContent='Вставьте ссылку на видео Google Диска';button.disabled=true;$('message').textContent='Получение файла...';try{const result=await request('/api/import-cloud',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});$('message').textContent='Ссылка принята, начинается получение файла';input.value='';current=result.id;detailSignature='';await refresh()}catch(e){const duplicateId=e.status===409&&typeof e.data?.detail==='string'?e.data.detail.match(/ID:\s*([a-f0-9]+)/i)?.[1]:null;if(e.status===409)showDuplicateMessage(duplicateId);else $('message').textContent='Ошибка: '+e.message}finally{button.disabled=false}}}
setupCloudImport();
let current=null;
let listSignature='';
let detailSignature='';
const detailOpenByMeeting=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,opts){const r=await fetch(url,opts);const data=await r.json();if(!r.ok){const error=Error(data.detail||'Ошибка запроса');error.status=r.status;error.data=data;throw error}return data}
function showDuplicateMessage(meetingId){const message=$('message');message.textContent='Эта запись уже обработана';if(!meetingId)return;const button=document.createElement('button');button.type='button';button.textContent='Открыть готовый конспект';button.style.marginLeft='8px';button.onclick=()=>openMeeting(meetingId);message.append(' ',button)}
function meetingsSignature(list){return JSON.stringify(list.map(m=>[m.id,m.name,m.created_at,m.source,m.status]))}
function meetingSignature(m){return JSON.stringify([m.id,m.name,m.created_at,m.source,m.status,m.error,m.transcript,m.summary])}
function bindMeetingButtons(){document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>openMeeting(btn.dataset.id))}
function renderMeetings(list){$('meetings').innerHTML=list.length?list.map(m=>`<div class="meeting"><b>${esc(m.name)}</b><p class="muted">${esc(new Date(m.created_at).toLocaleString('ru-RU'))} · ${esc(m.source)} · ${esc(m.status)}</p><button data-id="${m.id}">Открыть</button></div>`).join(''):'Пока нет обработанных встреч';bindMeetingButtons()}
async function refresh(){try{const list=await request('/api/meetings');const nextListSignature=meetingsSignature(list);if(nextListSignature!==listSignature){renderMeetings(list);listSignature=nextListSignature}if(current)await openMeeting(current)}catch(e){$('meetings').textContent=e.message}}
function items(arr){return arr?.length?'<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">Не указано в записи</p>'}
function rememberDetails(id){const details=$('detail').querySelector('details');if(id&&details)detailOpenByMeeting.set(id,details.open)}
function renderMeeting(m,detailsOpen){let s=m.summary,html=`<h2>${esc(m.name)}</h2><p>Статус: ${esc(m.status)}</p>`;if(m.error)html+=`<p class="error">${esc(m.error)}</p>`;if(s)html+=`<h3>Краткое содержание</h3><p>${esc(s.brief)}</p><h3>Решения</h3>${items(s.decisions)}<h3>Задачи</h3>${items(s.tasks)}<h3>Открытые вопросы</h3>${items(s.questions)}`;if(m.transcript)html+=`<p><button id="resummarize">Пересоздать конспект</button> <small>из сохранённой расшифровки, без повторной загрузки видео</small></p><details><summary>Расшифровка встречи</summary><pre>${esc(m.transcript)}</pre></details>`;$('detail').innerHTML=html;$('detail').hidden=false;const details=$('detail').querySelector('details');if(details){details.open=detailsOpen;detailOpenByMeeting.set(m.id,details.open);details.addEventListener('toggle',()=>detailOpenByMeeting.set(m.id,details.open))}const button=$('detail').querySelector('#resummarize');if(button&&m.status==='AI-анализ'){button.disabled=true;button.textContent='Формирование...'}if(button&&!button.disabled)button.onclick=async()=>{button.disabled=true;button.textContent='Формирование...';try{await request('/api/meetings/'+m.id+'/resummarize',{method:'POST'});$('message').textContent='Конспект пересоздаётся из сохранённой расшифровки';await openMeeting(m.id)}catch(e){$('message').textContent='Ошибка: '+e.message;button.disabled=false;button.textContent='Пересоздать конспект'}}}
async function openMeeting(id){const previousId=current;if(previousId&&previousId!==id)rememberDetails(previousId);current=id;const m=await request('/api/meetings/'+id);const nextDetailSignature=meetingSignature(m);const currentDetails=$('detail').querySelector('details');const detailsOpen=previousId===id?Boolean(currentDetails?.open):Boolean(detailOpenByMeeting.get(id));if(!$('detail').hidden&&nextDetailSignature===detailSignature)return;detailSignature=nextDetailSignature;renderMeeting(m,detailsOpen)}
$('send').onclick=async()=>{const f=$('file').files[0];if(!f)return $('message').textContent='Сначала выберите видео';$('send').disabled=true;$('message').textContent='Получение файла...';try{const data=new FormData();data.append('file',f);const result=await request('/api/upload',{method:'POST',body:data});$('message').textContent='Видео принято, начинается анализ';current=result.id;detailSignature='';await refresh()}catch(e){$('message').textContent='Ошибка: '+e.message}finally{$('send').disabled=false}};refresh();setInterval(refresh,3000);
</script></body></html>
